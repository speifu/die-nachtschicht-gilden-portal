<script>
    const CLIENT_ID = '1561898325244903468';
    // Exakte Zieladresse für den Login
    const REDIRECT_URI = 'https://speifu.github.io/die-nachtschicht-gilden-portal/';

    function openTab(evt, tabName) {
        const contents = document.getElementsByClassName("tab-content");
        for (let i = 0; i < contents.length; i++) contents[i].classList.remove("active");
        
        const buttons = document.getElementsByClassName("nav-btn");
        for (let i = 0; i < buttons.length; i++) buttons[i].classList.remove("active");

        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    function filterTable() {
        const input = document.getElementById("memberSearch").value.toUpperCase();
        const trs = document.getElementById("memberTable").getElementsByTagName("tr");
        for (let i = 1; i < trs.length; i++) {
            const txt = trs[i].textContent || trs[i].innerText;
            trs[i].style.display = txt.toUpperCase().indexOf(input) > -1 ? "" : "none";
        }
    }

    // Discord Login-Weiterleitung
    function loginWithDiscord() {
        const scope = encodeURIComponent('identify guilds.members.read');
        const redirect = encodeURIComponent(REDIRECT_URI);
        const discordUrl = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${redirect}&response_type=token&scope=${scope}`;
        
        // Leitet den Browser direkt zur Discord-Freigabe weiter
        window.location.href = discordUrl;
    }

    // Prüfen, ob der User von Discord zurückgekehrt ist
    window.addEventListener('DOMContentLoaded', () => {
        const hash = window.location.hash.slice(1);
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');

        if (accessToken) {
            fetch('https://discord.com/api/users/@me', {
                headers: { authorization: `Bearer ${accessToken}` }
            })
            .then(res => res.json())
            .then(user => {
                const btn = document.getElementById("discordBtn");
                if (btn) {
                    btn.classList.add("active");
                    btn.innerHTML = `<span>Aktiv: ${user.username}</span>`;
                }
                // Schaltet den Offi-Modus frei
                document.body.classList.add("offi-mode");
            })
            .catch(err => console.error("Discord Auth Fehler:", err));
        }
    });
</script>
